version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meeting_booking_backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - NODE_ENV=production
      - JWT_SECRET=meeting_booking_jwt_secret_key_2024
      - JWT_REFRESH_SECRET=meeting_booking_refresh_secret_key_2024
      - CLIENT_URL=http://localhost
      - AI_PROVIDER=groq
      # Cấu hình API Key cho Chatbot AI (Thay thế key thật tại đây nếu cần)
      - GROQ_API_KEY=your_groq_api_key_here
      - GEMINI_API_KEY=your_gemini_api_key_here
    volumes:
      # Mount thư mục chứa file SQLite DB và ảnh upload để dữ liệu không bị mất khi restart container
      - ./backend/data:/app/data
      - ./backend/uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meeting_booking_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
