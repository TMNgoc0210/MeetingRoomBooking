services:
  - type: web
    name: meeting-booking
    runtime: node
    rootDir: backend
    buildCommand: >
      cd ../frontend && npm ci && npm run build &&
      mkdir -p ../backend/public &&
      cp -r dist/* ../backend/public/ &&
      cd ../backend && npm ci
    startCommand: node server.js
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5001
      - key: DB_SERVER
        sync: false
      - key: DB_PORT
        value: 1433
      - key: DB_NAME
        value: MeetingRoomBooking
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_ENCRYPT
        value: "true"
      - key: CLIENT_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
